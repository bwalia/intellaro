---
apiVersion: v1
kind: Namespace
metadata:
  name: intellaro-system
  labels:
    app.kubernetes.io/part-of: intellaro

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intellaro-ingress-controller
  namespace: intellaro-system
  labels:
    app.kubernetes.io/name: intellaro-ingress
    app.kubernetes.io/component: controller

---
# ClusterRole granting read/write access to Intellaro CRDs and read access
# to core resources needed for ingress discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: intellaro-ingress-controller
  labels:
    app.kubernetes.io/name: intellaro-ingress
rules:
  # Intellaro CRDs — full control.
  - apiGroups: ["ingress.intellaro.io"]
    resources:
      - intellarovhosts
      - intellarovhosts/status
      - intellaroroutes
      - intellaroroutes/status
      - intellarolbpolicies
      - intellarolbpolicies/status
      - intellarosecuritypolicies
      - intellarosecuritypolicies/status
      - intellarocachepolicies
      - intellarocachepolicies/status
      - intellaroservicediscoveries
      - intellaroservicediscoveries/status
      - intellaroroutingpolicies
      - intellaroroutingpolicies/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Core resources for service/endpoint discovery.
  - apiGroups: [""]
    resources:
      - services
      - endpoints
      - pods
      - secrets
      - configmaps
      - namespaces
    verbs: ["get", "list", "watch"]

  # EndpointSlice API for scalable service discovery.
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]

  # Standard Ingress resources (for compatibility).
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - ingressclasses
    verbs: ["get", "list", "watch", "update", "patch"]

  # Events for recording reconciliation outcomes.
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]

  # Coordination for leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: intellaro-ingress-controller
  labels:
    app.kubernetes.io/name: intellaro-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: intellaro-ingress-controller
subjects:
  - kind: ServiceAccount
    name: intellaro-ingress-controller
    namespace: intellaro-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: intellaro-ingress-config
  namespace: intellaro-system
data:
  INTELLARO_MCP_URL: "http://intellaro-http-server.intellaro-system.svc:9091"
  INTELLARO_METRICS_PORT: "9090"
  INTELLARO_HEALTH_PORT: "8081"
  RUST_LOG: "info"
  RUST_LOG_FORMAT: "json"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellaro-ingress-controller
  namespace: intellaro-system
  labels:
    app.kubernetes.io/name: intellaro-ingress
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: intellaro-ingress
      app.kubernetes.io/component: controller
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intellaro-ingress
        app.kubernetes.io/component: controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: intellaro-ingress-controller
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: intellaro/intellaro-ingress:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: intellaro-ingress-config
          env:
            - name: INTELLARO_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intellaro-ingress-secrets
                  key: mcp-api-key
                  optional: true
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: intellaro-ingress-metrics
  namespace: intellaro-system
  labels:
    app.kubernetes.io/name: intellaro-ingress
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: intellaro-ingress
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: intellaro-ingress-controller
  namespace: intellaro-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intellaro-ingress
      app.kubernetes.io/component: controller
