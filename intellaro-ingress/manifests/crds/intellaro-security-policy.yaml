apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: intellarosecuritypolicies.ingress.intellaro.io
spec:
  group: ingress.intellaro.io
  names:
    kind: IntellaroSecurityPolicy
    plural: intellarosecuritypolicies
    singular: intellarosecuritypolicy
    shortNames:
      - isp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                jwt:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    secretRef:
                      type: string
                    issuer:
                      type: string
                    audience:
                      type: string
                    jwksUri:
                      type: string
                    tokenHeader:
                      type: string
                    forwardClaims:
                      type: boolean
                      default: false
                ipAllow:
                  type: array
                  items:
                    type: string
                ipBlock:
                  type: array
                  items:
                    type: string
                rateLimit:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    maxRequests:
                      type: integer
                    windowSecs:
                      type: integer
                      default: 60
                    key:
                      type: string
                      enum:
                        - client_ip
                        - user
                    statusCode:
                      type: integer
                cors:
                  type: object
                  properties:
                    allowOrigins:
                      type: array
                      items:
                        type: string
                    allowMethods:
                      type: array
                      items:
                        type: string
                    allowHeaders:
                      type: array
                      items:
                        type: string
                    exposeHeaders:
                      type: array
                      items:
                        type: string
                    allowCredentials:
                      type: boolean
                      default: false
                    maxAgeSecs:
                      type: integer
                targetRefs:
                  type: array
                  items:
                    type: object
                    required:
                      - kind
                      - name
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
            status:
              type: object
              properties:
                synced:
                  type: boolean
                lastSyncedAt:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: JWT
          type: boolean
          jsonPath: .spec.jwt.enabled
        - name: RateLimit
          type: boolean
          jsonPath: .spec.rateLimit.enabled
        - name: Synced
          type: string
          jsonPath: .status.synced
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
