apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: intellarovhosts.ingress.intellaro.io
spec:
  group: ingress.intellaro.io
  names:
    kind: IntellaroVHost
    plural: intellarovhosts
    singular: intellarovhost
    shortNames:
      - ivh
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - hostname
                - upstream
              properties:
                hostname:
                  type: string
                  description: Fully-qualified hostname this vhost serves.
                aliases:
                  type: array
                  items:
                    type: string
                tls:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    secretName:
                      type: string
                    acme:
                      type: boolean
                      default: false
                    minVersion:
                      type: string
                upstream:
                  type: string
                  description: Name of the upstream backend group.
                lbPolicyRef:
                  type: string
                securityPolicyRef:
                  type: string
                cachePolicyRef:
                  type: string
                defaultBackend:
                  type: object
                  properties:
                    serviceName:
                      type: string
                    servicePort:
                      type: integer
                    namespace:
                      type: string
            status:
              type: object
              properties:
                synced:
                  type: boolean
                lastSyncedAt:
                  type: string
                activeBackends:
                  type: integer
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Host
          type: string
          jsonPath: .spec.hostname
        - name: TLS
          type: boolean
          jsonPath: .spec.tls.enabled
        - name: Synced
          type: string
          jsonPath: .status.synced
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
