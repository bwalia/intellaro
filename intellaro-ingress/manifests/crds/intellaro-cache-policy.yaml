apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: intellarocachepolicies.ingress.intellaro.io
spec:
  group: ingress.intellaro.io
  names:
    kind: IntellaroCachePolicy
    plural: intellarocachepolicies
    singular: intellarocachepolicy
    shortNames:
      - icp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                defaultTtlSecs:
                  type: integer
                  default: 300
                maxEntries:
                  type: integer
                  default: 10000
                evictionStrategy:
                  type: string
                  enum:
                    - lru
                    - lfu
                    - ttl_only
                  default: lru
                pathRules:
                  type: array
                  items:
                    type: object
                    required:
                      - pathPrefix
                    properties:
                      pathPrefix:
                        type: string
                      ttlSecs:
                        type: integer
                      bypass:
                        type: boolean
                        default: false
                cacheableMethods:
                  type: array
                  items:
                    type: string
                  default:
                    - GET
                    - HEAD
                cacheableStatuses:
                  type: array
                  items:
                    type: integer
                  default:
                    - 200
                    - 301
                    - 302
                respectOriginHeaders:
                  type: boolean
                  default: true
                prefetch:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    minHits:
                      type: integer
                      default: 10
                    lookaheadSecs:
                      type: integer
                      default: 60
                varyHeaders:
                  type: array
                  items:
                    type: string
                targetRefs:
                  type: array
                  items:
                    type: object
                    required:
                      - kind
                      - name
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
            status:
              type: object
              properties:
                synced:
                  type: boolean
                lastSyncedAt:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Strategy
          type: string
          jsonPath: .spec.evictionStrategy
        - name: Synced
          type: string
          jsonPath: .status.synced
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
