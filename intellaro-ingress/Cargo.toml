[package]
name = "intellaro-ingress"
version = "0.1.0"
edition = "2021"
description = "Kubernetes-native ingress controller powered by intellaro-http-server"
license = "Proprietary"

[dependencies]
# Kubernetes
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["latest"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP client (for MCP API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Explicit CryptoProvider selection (see lib.rs run())
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# Schema
schemars = "0.8"

# Logging & metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

