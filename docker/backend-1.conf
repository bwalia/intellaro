server {
    listen 80;
    server_name _;

    location / {
        default_type application/json;
        return 200 '{"server": "backend-1", "message": "Hello from Backend 1", "timestamp": "$time_iso8601"}';
    }

    location /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location /slow {
        default_type application/json;
        # Simulate a slow endpoint (2 second delay)
        set $delay 2;
        return 200 '{"server": "backend-1", "endpoint": "slow", "delay_seconds": 2}';
    }

    location /status {
        default_type application/json;
        return 200 '{"server": "backend-1", "status": "healthy", "version": "1.0.0"}';
    }
}
