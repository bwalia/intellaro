server {
    listen 80;
    server_name _;

    location / {
        default_type application/json;
        return 200 '{"server": "backend-2", "message": "Hello from Backend 2", "timestamp": "$time_iso8601"}';
    }

    location /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location /slow {
        default_type application/json;
        return 200 '{"server": "backend-2", "endpoint": "slow", "delay_seconds": 0}';
    }

    location /status {
        default_type application/json;
        return 200 '{"server": "backend-2", "status": "healthy", "version": "1.0.0"}';
    }
}
