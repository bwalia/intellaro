# Intellaro HTTP Server — Docker Compose test configuration
#
# This config routes traffic through Intellaro to two nginx backend
# instances with round-robin load balancing, caching enabled,
# rate limiting, and the management API exposed.

listeners:
  - address: "0.0.0.0:8080"
    protocol: auto

worker_count: 4

upstreams:
  # Default upstream: two nginx backends behind round-robin LB
  - name: default
    servers:
      - address: "backend-1:80"
        weight: 1
      - address: "backend-2:80"
        weight: 1
    load_balancing: round_robin
    health_check:
      path: /
      interval_secs: 5
      unhealthy_threshold: 3

  # Weighted upstream: favors backend-1 (3:1 ratio)
  - name: weighted-demo
    servers:
      - address: "backend-1:80"
        weight: 3
      - address: "backend-2:80"
        weight: 1
    load_balancing: weighted

cache:
  enabled: true
  max_entries: 10000
  default_ttl_secs: 60
  cache_post: false

security:
  rate_limit:
    max_requests: 500
    window_secs: 60

static_roots:
  - url_prefix: "/"
    directory: "/usr/local/share/intellaro/static"

logging:
  level: debug
  format: json
  metrics_path: /metrics

management_api:
  address: "0.0.0.0:9091"
  api_key: "intellaro-test-key"
