[package]
name = "intellaro-http-cli"
version = "0.1.0"
edition = "2021"
authors = ["Intellaro Contributors"]
description = "CLI tool for managing Intellaro HTTP Server remotely via MCP/REST APIs"
license = "Proprietary"
rust-version = "1.75"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Output formatting
comfy-table = "7"
colored = "3"

# Interactive mode
rustyline = "15"

# Configuration file management
dirs = "6"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Diff support
similar = "2"

# URL handling
url = "2"

# IP network parsing (for CIDR validation)
ipnet = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
