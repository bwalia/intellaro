[workspace]
resolver = "2"
members = [
    "intellaro-http-router",
    "intellaro-http-server",
    "intellaro-http-cli",
    "intellaro-ingress",
    "intellaro-config",
    "intellaro-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.75"

# Release profile shared by every crate in the workspace.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
