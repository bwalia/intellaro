[package]
name = "intellaro-http-router"
version = "0.1.0"
edition = "2021"
description = "Intelligent AI-powered HTTP routing engine for intellaro-http-server"
license = "Proprietary"

[lib]
name = "intellaro_http_router"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrent data structures
dashmap = "6"

# Metrics
metrics = "0.24"

# Logging
tracing = "0.1"

# Regex for path matching
regex = "1"

# Hashing for consistent hash and sticky sessions
ahash = "0.8"

# Random number generation (for weighted selection)
rand = "0.9"

# Timestamp and duration utilities
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

