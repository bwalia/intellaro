# Intellaro HTTP Server — Example Kubernetes Deployment
#
# Deploys Intellaro as an Ingress Controller with HA (3 replicas),
# horizontal pod autoscaling, and a Prometheus ServiceMonitor.
---
apiVersion: v1
kind: Namespace
metadata:
  name: intellaro

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: intellaro-config
  namespace: intellaro
data:
  config.yaml: |
    listeners:
      - address: "0.0.0.0:8080"
        protocol: auto
      - address: "0.0.0.0:8443"
        protocol: auto
        tls:
          cert_path: /etc/intellaro/tls/tls.crt
          key_path: /etc/intellaro/tls/tls.key
          min_version: "1.2"

    worker_count: 4

    upstreams:
      - name: default-backend
        servers:
          - address: "backend-service.default.svc.cluster.local:80"
            weight: 1
        load_balancing: round_robin
        health_check:
          path: /healthz
          interval_secs: 10
          unhealthy_threshold: 3

    cache:
      enabled: true
      max_entries: 50000
      default_ttl_secs: 300

    security:
      rate_limit:
        max_requests: 1000
        window_secs: 60

    logging:
      level: info
      format: json
      metrics_path: /metrics

    management_api:
      address: "0.0.0.0:9091"

    cluster:
      node_id: ""
      peers: []
      port: 7946

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellaro-http-server
  namespace: intellaro
  labels:
    app: intellaro-http-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: intellaro-http-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: intellaro-http-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: intellaro
          image: intellaro/http-server:latest
          args:
            - --config
            - /etc/intellaro/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: management
              containerPort: 9091
              protocol: TCP
            - name: cluster
              containerPort: 7946
              protocol: UDP
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: management
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config-volume
              mountPath: /etc/intellaro
              readOnly: true
            - name: tls-certs
              mountPath: /etc/intellaro/tls
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: intellaro-config
        - name: tls-certs
          secret:
            secretName: intellaro-tls

---
apiVersion: v1
kind: Service
metadata:
  name: intellaro-http-server
  namespace: intellaro
  labels:
    app: intellaro-http-server
spec:
  type: LoadBalancer
  selector:
    app: intellaro-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intellaro-http-server
  namespace: intellaro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intellaro-http-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
