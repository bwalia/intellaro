server {
    listen 80;
    server_name _;

    location / {
        default_type text/plain;
        return 200 'backend1';
    }

    location /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location /api/data {
        default_type application/json;
        return 200 '{"source":"backend1","status":"ok"}';
    }

    location /slow {
        default_type text/plain;
        # Simulate a slow response — 3 second delay is not feasible in pure nginx
        # but we return immediately for test purposes.
        return 200 'backend1-slow';
    }
}
