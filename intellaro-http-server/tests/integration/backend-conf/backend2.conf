server {
    listen 80;
    server_name _;

    location / {
        default_type text/plain;
        return 200 'backend2';
    }

    location /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location /api/data {
        default_type application/json;
        return 200 '{"source":"backend2","status":"ok"}';
    }

    location /slow {
        default_type text/plain;
        return 200 'backend2-slow';
    }
}
