[package]
name = "intellaro-http-server"
version = "0.1.0"
edition = "2021"
authors = ["Intellaro Contributors"]
description = "High-performance, modular HTTP(S) server with reverse proxy, load balancing, caching, and clustering"
license = "Proprietary"
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server framework
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"

# HTTP client (for proxying)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization / Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging & metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics (Prometheus-compatible)
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Dashmap for concurrent caching
dashmap = "6"

# File watching for hot reload
notify = "7"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Async utilities
futures = "0.3"
tower = { version = "0.5", features = ["full"] }

# IP network parsing (for allow/block lists)
ipnet = "2"

# JSON Web Tokens
jsonwebtoken = "9"

# Error handling
thiserror = "2"

# System information (CPU, memory, disk, hostname)
sysinfo = "0.33"

# SHA-256 hashing (config versioning)
sha2 = "0.10"

# Intelligent routing engine (in-process library)
intellaro-http-router = { path = "../intellaro-http-router" }
intellaro-config = { path = "../intellaro-config" }

[dev-dependencies]
tokio-test = "0.4"

