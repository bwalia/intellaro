name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILDKIT: 1

jobs:
  # ── Cargo check & clippy ─────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            intellaro-http-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('intellaro-http-server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check compilation
        working-directory: intellaro-http-server
        run: cargo check --release

      - name: Run clippy
        working-directory: intellaro-http-server
        run: cargo clippy -- -D warnings || true

      - name: Check formatting
        working-directory: intellaro-http-server
        run: cargo fmt -- --check || true

  # ── Docker integration tests ─────────────────────────────────────────
  integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('intellaro-http-server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build and start test stack
        working-directory: intellaro-http-server/tests/integration
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          echo "Docker Compose stack is up and healthy."

      - name: Show container status
        working-directory: intellaro-http-server/tests/integration
        if: always()
        run: |
          docker compose ps -a
          echo "---"
          docker compose logs intellaro-server --tail=50

      - name: Run integration tests
        working-directory: intellaro-http-server/tests/integration
        run: ./run-tests.sh

      - name: Collect server logs on failure
        working-directory: intellaro-http-server/tests/integration
        if: failure()
        run: |
          echo "=== intellaro-server logs ==="
          docker compose logs intellaro-server
          echo "=== backend1 logs ==="
          docker compose logs backend1
          echo "=== backend2 logs ==="
          docker compose logs backend2
          echo "=== backend3 logs ==="
          docker compose logs backend3

      - name: Tear down test stack
        working-directory: intellaro-http-server/tests/integration
        if: always()
        run: docker compose down -v --remove-orphans
